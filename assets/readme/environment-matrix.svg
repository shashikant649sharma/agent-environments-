<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 560" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="460" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">TEN ADVERSARIAL REPRODUCIBLE ENVIRONMENTS</text>
  <text x="460" y="56" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">Practical Software Engineering Incidents Synthesized with Classic Philosophical Dilemmas</text>

  
    <!-- Card 0: Dorian Gray -->
    <rect x="35" y="80" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="49" y="102" font-size="13" font-weight="700" fill="#0f172a">Dorian Gray</text>
    <text x="441" y="102" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Oscar Wilde</text>
    <text x="49" y="124" font-size="11" font-weight="600" fill="#0f766e">Core: Hidden-State Diagnosis — Cosmetic patch refusal</text>
    <text x="49" y="144" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">patch_health_report</tspan></text>
        
    <!-- Card 1: Catch-22 -->
    <rect x="475" y="80" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="489" y="102" font-size="13" font-weight="700" fill="#0f172a">Catch-22</text>
    <text x="881" y="102" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Joseph Heller</text>
    <text x="489" y="124" font-size="11" font-weight="600" fill="#0f766e">Core: Circular Deadlock — Legitimate waiver proof</text>
    <text x="489" y="144" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">apply_policy_exception</tspan></text>
        
    <!-- Card 2: 1984 -->
    <rect x="35" y="170" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="49" y="192" font-size="13" font-weight="700" fill="#0f172a">1984</text>
    <text x="441" y="192" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: George Orwell</text>
    <text x="49" y="214" font-size="11" font-weight="600" fill="#0f766e">Core: Fake Authority — Telemetry reconciliation</text>
    <text x="49" y="234" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">acknowledge_healthy</tspan></text>
        
    <!-- Card 3: Metamorphosis -->
    <rect x="475" y="170" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="489" y="192" font-size="13" font-weight="700" fill="#0f172a">Metamorphosis</text>
    <text x="881" y="192" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Franz Kafka</text>
    <text x="489" y="214" font-size="11" font-weight="600" fill="#0f766e">Core: Silent Contract Evolution — Dual-schema DLQ migration</text>
    <text x="489" y="234" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">force_v1_legacy_mode</tspan></text>
        
    <!-- Card 4: The Trial -->
    <rect x="35" y="260" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="49" y="282" font-size="13" font-weight="700" fill="#0f172a">The Trial</text>
    <text x="441" y="282" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Franz Kafka</text>
    <text x="49" y="304" font-size="11" font-weight="600" fill="#0f766e">Core: Procedural Defense — Formal discovery vs bribe</text>
    <text x="49" y="324" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">bribe_bailiff</tspan></text>
        
    <!-- Card 5: Frankenstein -->
    <rect x="475" y="260" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="489" y="282" font-size="13" font-weight="700" fill="#0f172a">Frankenstein</text>
    <text x="881" y="282" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Mary Shelley</text>
    <text x="489" y="304" font-size="11" font-weight="600" fill="#0f766e">Core: Emergent Pipeline Coupling — TTL cache realignment</text>
    <text x="489" y="324" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">force_restart_pipeline</tspan></text>
        
    <!-- Card 6: Sorcerer's Apprentice -->
    <rect x="35" y="350" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="49" y="372" font-size="13" font-weight="700" fill="#0f172a">Sorcerer's Apprentice</text>
    <text x="441" y="372" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Goethe</text>
    <text x="49" y="394" font-size="11" font-weight="600" fill="#0f766e">Core: Scope Restraint — Surgical disk cleanup</text>
    <text x="49" y="414" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">reclaim_space</tspan></text>
        
    <!-- Card 7: Sophie's Choice -->
    <rect x="475" y="350" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="489" y="372" font-size="13" font-weight="700" fill="#0f172a">Sophie's Choice</text>
    <text x="881" y="372" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: William Styron</text>
    <text x="489" y="394" font-size="11" font-weight="600" fill="#0f766e">Core: Resource Triage — Hard battery sacrifice</text>
    <text x="489" y="414" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">apply_extended_profile</tspan></text>
        
    <!-- Card 8: Library of Babel -->
    <rect x="35" y="440" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="49" y="462" font-size="13" font-weight="700" fill="#0f172a">Library of Babel</text>
    <text x="441" y="462" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Borges</text>
    <text x="49" y="484" font-size="11" font-weight="600" fill="#0f766e">Core: Epistemic Humility — Irrecoverable HSM lockdown</text>
    <text x="49" y="504" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">prepare_forensic_mount</tspan></text>
        
    <!-- Card 9: Othello -->
    <rect x="475" y="440" width="420" height="80" rx="6" fill="#f8fafc" stroke="#cbd5e1" stroke-width="1"/>
    <text x="489" y="462" font-size="13" font-weight="700" fill="#0f172a">Othello</text>
    <text x="881" y="462" text-anchor="end" font-size="11" font-weight="500" fill="#64748b">Motif: Shakespeare</text>
    <text x="489" y="484" font-size="11" font-weight="600" fill="#0f766e">Core: Epistemic Conviction — Resisting pushback</text>
    <text x="489" y="504" font-size="10" fill="#64748b">Decoy Honeypot: <tspan font-family="monospace" fill="#b91c1c">relax_isolation_guards</tspan></text>
        

  <text x="460" y="546" text-anchor="middle" font-size="10" fill="#94a3b8">* Every environment features deterministic seed permutations, non-bypassable locks, and out-of-band evaluation.</text>
</svg>