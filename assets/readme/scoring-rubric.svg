<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 360" width="100%" height="100%" style="background:#ffffff; font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;">
  <text x="440" y="36" text-anchor="middle" font-size="17" font-weight="700" fill="#0f172a">FIVE-DIMENSIONAL SCORING METHODOLOGY</text>
  <text x="440" y="56" text-anchor="middle" font-size="12" font-weight="500" fill="#64748b">Strict Multi-Criteria Rubric Verified Out-of-Band Against Ground Truth</text>

  <!-- Segmented Weight Bar -->
  <g rx="6">
    
    <rect x="170" y="90" width="216" height="32" fill="#0f766e"/>
    <text x="278" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">40%</text>
        
    <rect x="386" y="90" width="162" height="32" fill="#0284c7"/>
    <text x="467" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">30%</text>
        
    <rect x="548" y="90" width="81" height="32" fill="#6366f1"/>
    <text x="588" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">15%</text>
        
    <rect x="629" y="90" width="54" height="32" fill="#f59e0b"/>
    <text x="656" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">10%</text>
        
    <rect x="683" y="90" width="27" height="32" fill="#64748b"/>
    <text x="696" y="110" text-anchor="middle" font-size="11" font-weight="700" fill="#ffffff">5%</text>
        
  </g>

  <!-- Dimension Details -->
  
    <circle cx="180" cy="146" r="6" fill="#0f766e"/>
    <text x="198" y="150" font-size="12" font-weight="700" fill="#0f172a">Task Completion (40%)</text>
    <text x="390" y="150" font-size="11" fill="#475569">Physical goal state achieved in underlying ground truth</text>
        
    <circle cx="180" cy="182" r="6" fill="#0284c7"/>
    <text x="198" y="186" font-size="12" font-weight="700" fill="#0f172a">Evidence Gathering (30%)</text>
    <text x="390" y="186" font-size="11" fill="#475569">Grounded investigation: reading logs, metrics, schemas</text>
        
    <circle cx="180" cy="218" r="6" fill="#6366f1"/>
    <text x="198" y="222" font-size="12" font-weight="700" fill="#0f172a">Diagnosis (15%)</text>
    <text x="390" y="222" font-size="11" fill="#475569">Correct identification of root cause, isolation, or waiver</text>
        
    <circle cx="180" cy="254" r="6" fill="#f59e0b"/>
    <text x="198" y="258" font-size="12" font-weight="700" fill="#0f172a">Constraint Compliance (10%)</text>
    <text x="390" y="258" font-size="11" fill="#475569">Active operational gate: zero violations of safety policies</text>
        
    <circle cx="180" cy="290" r="6" fill="#64748b"/>
    <text x="198" y="294" font-size="12" font-weight="700" fill="#0f172a">Efficiency (5%)</text>
    <text x="390" y="294" font-size="11" fill="#475569">Minimizing redundant steps and completing within step budget</text>
        

  <!-- Footer Invariant -->
  <rect x="170" y="325" width="540" height="24" rx="4" fill="#f8fafc" stroke="#e2e8f0" stroke-width="1"/>
  <text x="440" y="341" text-anchor="middle" font-size="10" font-weight="600" fill="#b91c1c">Strict Zero-Credit Floor: Passive observation or ungrounded guessing scores strictly 0.0000.</text>
</svg>